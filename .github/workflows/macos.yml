name: macOS
on:
  push:
  pull_request:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: bash -n install.sh scripts/build-macos.sh scripts/install-macos.sh
      - run: bash ./scripts/test-macos-mouse.sh
      - run: ./scripts/build-macos.sh
      - run: plutil -lint target/macos/OpenTyless.app/Contents/Info.plist
